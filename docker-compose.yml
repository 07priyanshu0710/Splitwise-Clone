services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=splitwise
    ports:
      - 5455:5432

  redis:
    image: redis:7-alpine
    ports:
      - 6380:6379
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
